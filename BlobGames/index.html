<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blob Games</title>
<link rel="shortcut icon" href="/BlobGames/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;flex-direction:column;padding:24px 0;overflow-x:hidden}
.slime{position:fixed;z-index:0;top:-20px;bottom:-20px;width:clamp(48px,10vw,145px);pointer-events:none;background:linear-gradient(90deg,#075b0c,#2bd51b 25%,#8cff45 48%,#35dc20 75%,#075b0c);filter:drop-shadow(0 0 18px #48ff3866);animation:sway 4s ease-in-out infinite alternate}
.slime:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 12%,#e2ffb8cc 0 5px,transparent 17px),radial-gradient(ellipse at 75% 31%,#deffacaa 0 4px,transparent 15px),radial-gradient(ellipse at 38% 67%,#dcffa599 0 5px,transparent 19px);animation:bubbles 6s linear infinite}
.slime:after{content:"";position:absolute;top:0;left:0;right:0;height:35%;background:radial-gradient(ellipse at 15% 0%,#8cff45 0 18%,transparent 19%),radial-gradient(ellipse at 48% 0%,#8cff45 0 24%,transparent 25%),radial-gradient(ellipse at 83% 0%,#42ed27 0 19%,transparent 20%),linear-gradient(#8cff45,#39df20aa,transparent);border-radius:0 0 48% 42%;animation:drip 4s ease-in-out infinite alternate}
.left{left:0}.right{right:0;transform:scaleX(-1);animation-delay:-2s}
@keyframes sway{to{margin-top:3vh}}@keyframes drip{to{height:48%}}@keyframes bubbles{to{background-position:0 130px,0 -110px,0 180px}}
header,main{position:relative;z-index:1;width:min(850px,calc(100% - 145px))}header{text-align:center;margin:0 auto 18px}
h1{margin:0;color:#a7ff72;font-size:clamp(1.8rem,5vw,3.6rem);font-weight:1000;letter-spacing:.03em;text-shadow:0 3px #247b13,0 6px #14500c,0 0 12px #65ff36,0 0 28px #32d51c;-webkit-text-stroke:1px #d4ffbd;animation:goo 3s ease-in-out infinite}
@keyframes goo{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-1deg) scale(1.02,.98)}96%{transform:rotate(1deg) scale(.99,1.02)}}
.subtitle{color:#c9ffc0;margin:8px 0 0}
main{padding:18px;border:1px solid #69ff3780;border-radius:22px;background:#081208e8;box-shadow:0 0 28px #34ff301c,inset 0 0 24px #46ff280d}
.scores{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}.stat{min-width:100px;padding:8px 14px;border-radius:12px;text-align:center;background:#102410;border:1px solid #347b2b}.stat span{display:block;color:#b6e9aa;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}.stat strong{font-size:1.5rem;font-variant-numeric:tabular-nums}
#status{text-align:center;min-height:24px;color:#caffbe;margin:0 0 10px}
#board{display:grid;grid-template-columns:repeat(3,minmax(65px,1fr));gap:clamp(8px,2vw,18px);max-width:620px;margin:auto}
.hole{position:relative;aspect-ratio:1.25/1;overflow:hidden;border-radius:50%;border:2px solid #245d20;background:radial-gradient(ellipse,#020702 0 38%,#102510 40% 58%,#1a3517 61%,#071007 75%);box-shadow:inset 0 10px 14px #000,0 4px #183c14;display:grid;place-items:center;cursor:pointer;padding:0}
.mole{width:78%;height:90%;position:absolute;bottom:2%;transform-origin:50% 85%;filter:drop-shadow(0 4px 2px #0008);animation:spawn .28s cubic-bezier(.2,1.6,.4,1) both,wobble 1.2s ease-in-out .28s infinite}
.mole.out{animation:despawn .23s ease-in forwards}
@keyframes spawn{0%{transform:translateY(115%) scale(.5,.25) rotate(-10deg);opacity:0}65%{transform:translateY(-8%) scale(1.08,.92) rotate(5deg);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes despawn{to{transform:translateY(115%) scale(.45,.2) rotate(-12deg);opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-2px)}50%{transform:rotate(3deg) translateY(1px)}75%{transform:rotate(-2deg)}}
.points{position:absolute;right:7px;top:4px;font-weight:bold;text-shadow:0 2px 3px #000;font-size:clamp(.7rem,2vw,1rem)}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 15px;margin:15px 0 0;font-size:.82rem;color:#d8f5d1}.legend b{color:white}.legend-slime{display:inline-block;width:15px;height:15px;vertical-align:-3px;margin-right:4px;filter:drop-shadow(0 0 3px currentColor)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
#restart{display:none;margin:18px auto 0;padding:11px 26px;border:0;border-radius:999px;background:linear-gradient(#8dff63,#35cf24);color:#082607;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 4px #18700f,0 0 18px #3fff3655}
@media(max-width:560px){body{padding-top:18px}header,main{width:calc(100% - 100px)}main{padding:12px 8px}.stat{min-width:78px;padding:7px 9px}.slime{width:clamp(40px,9vw,60px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

const kinds={blue:{points:1,hits:1,color:'#35aaff'},green:{points:5,hits:3,color:'#45f044'},magenta:{points:10,hits:5,color:'#ff45d4'},orange:{points:50,hits:10,color:'#ff9a25'}};
const holes=[...document.querySelectorAll('.hole')],$=id=>document.getElementById(id);

const soundSets={
  pop:['https://cdn.dashnet.org/cookieclicker/snd/pop1.mp3','https://cdn.dashnet.org/cookieclicker/snd/pop2.mp3','https://cdn.dashnet.org/cookieclicker/snd/pop3.mp3'],
  squish:['https://cdn.dashnet.org/cookieclicker/snd/squish1.mp3','https://cdn.dashnet.org/cookieclicker/snd/squish2.mp3','https://cdn.dashnet.org/cookieclicker/snd/squish3.mp3','https://cdn.dashnet.org/cookieclicker/snd/squish4.mp3']
};
function playRandomSound(type){
  const choices=soundSets[type],src=choices[Math.floor(Math.random()*choices.length)];
  const audio=new Audio(src);
  audio.volume=.65;
  audio.play().catch(()=>{});
}

let score=0,high=0,start=0,ended=false,spawnTimer,clockTimer;
try{high=Number(localStorage.getItem('blobGamesHighScore'))||0}catch(e){}
$('high').textContent=high;
function phase(t){if(t<10)return{weights:[['blue',100]],life:5000};if(t<30)return{weights:[['blue',75],['green',25]],life:3000};if(t<60)return{weights:[['blue',50],['green',30],['magenta',20]],life:2000};return{weights:[['blue',30],['green',30],['magenta',30],['orange',10]],life:2800}}
function pick(t){let r=Math.random()*100;for(const [k,w] of phase(t).weights){r-=w;if(r<0)return k}return'blue'}
function updateScore(n){score=n;$('score').textContent=score;if(score>high){high=score;$('high').textContent=high;try{localStorage.setItem('slimeGamesHighScore',String(high))}catch(e){}}}
function clearHole(h,animate=true){let m=h.querySelector('.mole');if(!m)return;clearTimeout(m._life);if(animate){m.classList.add('out');setTimeout(()=>{if(m.parentNode===h){m.remove();h.querySelector('.points')?.remove()}},250)}else{m.remove();h.querySelector('.points')?.remove()}}
function spawn(h){if(ended||h.querySelector('.mole'))return;let t=(performance.now()-start)/1000,k=pick(t),v=kinds[k];let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 512 512');svg.setAttribute('class','mole');svg.setAttribute('aria-label',k+' slime');let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',PATH);p.setAttribute('fill',v.color);p.setAttribute('stroke','#0005');p.setAttribute('stroke-width','5');svg.append(p);svg.dataset.kind=k;svg.dataset.left=v.hits;h.append(svg);let badge=document.createElement('span');badge.className='points';badge.textContent='+'+v.points;h.append(badge);svg._life=setTimeout(()=>clearHole(h),phase(t).life)}
function hit(h){if(ended)return;let m=h.querySelector('.mole');if(!m)return;let k=m.dataset.kind,left=--m.dataset.left;if(left==0)playRandomSound('pop');else if(left>0)playRandomSound('squish'); m.style.filter=`drop-shadow(0 0 9px ${kinds[k].color}) drop-shadow(0 4px 2px #0008)`;if(left==0){clearTimeout(m._life);updateScore(score+kinds[k].points);$('status').textContent='+'+kinds[k].points+' pontos!';clearHole(h)}else if(left>0){$('status').textContent='Faltam '+left+' acerto(s) para eliminar esse slime!';m.animate([{transform:'scale(1.12,.88) rotate(-5deg)'},{transform:'scale(1)'}],{duration:130})}}
function finish(){if(ended)return;ended=true;clearInterval(spawnTimer);clearInterval(clockTimer);holes.forEach(h=>clearHole(h));$('time').textContent='0:00';$('status').textContent=`Fim de jogo! Você fez ${score} pontos. Recorde: ${high}.`;$('restart').style.display='block'}
function tick(){if(ended)return;let left=Math.max(0,120-(performance.now()-start)/1000);$('time').textContent=Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');if(left<=0)finish()}
function begin(){clearInterval(spawnTimer);clearInterval(clockTimer);holes.forEach(h=>clearHole(h,false));score=0;$('score').textContent='0';ended=false;try{high=Number(localStorage.getItem('slimeGamesHighScore'));$('high').textContent=String(high)}catch(e){};$('restart').style.display='none';$('status').textContent='Clique nos slimes! O jogo já começou.';start=performance.now();tick();spawnTimer=setInterval(()=>{if(ended)return;let free=holes.filter(h=>!h.querySelector('.mole'));if(free.length&&Math.random()<.85)spawn(free[Math.floor(Math.random()*free.length)])},500);clockTimer=setInterval(tick,100)}
holes.forEach(h=>h.addEventListener('click',()=>hit(h)));$('restart').addEventListener('click',begin);begin();
</script></body></html>
